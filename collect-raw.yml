name: 采集原始报告数据

on:
  # 定时：北京时间次日 01:40（主看板 01:00 跑完之后再采，避免两个任务抢接口）
  schedule:
    - cron: "40 17 * * *"

  # 允许手动触发（首次回填历史月份请手动跑一次）
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "scripts/collect_raw.py"
      - ".github/workflows/collect-raw.yml"

concurrency:
  group: collect-raw
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # 首次回填要拉全部历史月份，给足 5 小时；日常增量只需 20~40 分钟
    timeout-minutes: 300

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 同步远端最新
        run: git pull --rebase origin main || true

      - name: 按月采集原始报告
        env:
          HY_ENT: ${{ secrets.HY_ENT }}
          HY_USERNAME: ${{ secrets.HY_USERNAME }}
          HY_PASSWORD: ${{ secrets.HY_PASSWORD }}
          HY_API_BASE: ${{ secrets.HY_API_BASE }}
          HY_IMG_BASE: ${{ secrets.HY_IMG_BASE }}
        run: python scripts/collect_raw.py

      - name: 提交原始数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/raw/
          if git diff --staged --quiet; then
            echo "原始数据无变化，跳过提交"
          else
            git commit -m "chore(raw): 更新原始报告数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push --force-with-lease origin main
          fi
